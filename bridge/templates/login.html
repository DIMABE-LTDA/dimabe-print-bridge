<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · {{ app_name }}</title>
<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}?v={{ version }}">
<script>try{var t=localStorage.getItem("bridge-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
{% include "icons.html" %}
<main class="login">
  <form class="login-card" method="post" action="/panel/login">
    <div class="brandmark"><div class="logo" aria-hidden="true"><svg class="i"><use href="#i-lock"/></svg></div><div><b>Print Bridge</b><span>{{ host }}</span></div></div>
    <h1>Entrar al panel</h1>
    <p>Estás abriendo el panel de esta caja desde la red.</p>
    <div class="field"><label for="u">Usuario</label><input id="u" name="user" class="input" autocomplete="username" required autofocus></div>
    <div class="field"><label for="pw">Clave</label><input id="pw" name="password" class="input" type="password" autocomplete="current-password" required{% if error %} aria-describedby="pwe" aria-invalid="true"{% endif %}>
      {% if error %}<div class="err" id="pwe" role="alert">Usuario o clave incorrectos. Tras 5 intentos el acceso se bloquea por 10 minutos.</div>{% endif %}</div>
    <button class="btn primary block" type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
