# Pruebas en cada pull request (main está protegido: se fusiona solo con PR).
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
